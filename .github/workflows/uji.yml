name: uji

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang torch versi CPU (jauh lebih kecil dari versi GPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Pasang dependensi lain
        run: pip install -r requirements.txt
      - name: Jalankan semua uji + cakupan cabang
        run: pytest --cov=marspec --cov-branch --cov-report=term-missing
